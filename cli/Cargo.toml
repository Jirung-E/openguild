[package]
name = "openguild-cli"
version = "0.5.2-beta"
license = "MIT"
edition = "2024"
description = "openguild CLI — local + remote guild operations"

[[bin]]
name = "openguild"
path = "src/main.rs"

[dependencies]
openguild-core = { path = "../core" }

clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# tokio: 로컬 모드에서 current_thread runtime 만 빌더로 생성. #[tokio::main] 미사용.
tokio = { version = "1", features = ["rt"] }
# sqlx: SqlitePool 타입만 사용 (migrate 는 core 가 호출).
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
# DEV-169: Windows exe 아이콘 임베드 (cfg(windows) 에서만 동작 — 다른 OS 는 no-op).
winresource = "0.1"
