name: check

# DEV-008: PR / push 시 자동 검증.
# BUG-017: Linux deps + Node 24 + job 이름.
# BUG-017 후속 (fix1):
#   - cargo job 이 frontend build 결과 (gui/frontend/build) 를 필요로 함
#     (`tauri::generate_context!` proc macro 가 frontendDist 검증). cargo
#     job 안에서 먼저 frontend build 후 cargo test.
#   - actions/* v4 → v5 (Node 24 default 라 deprecation 경고 사라짐).
#     v5 가 없으면 GitHub 가 v4 로 resolve 함 — 안전.
#
# BUG-172: Node 20 deprecation 경고 대응 — node20 런타임 액션만 상향.
#   upload-artifact v4 → v7, action-gh-release v2 → v3.
#   (checkout/setup-node/cache v5, Swatinem/rust-cache v2 는 이미 node24,
#    dtolnay/rust-toolchain 은 composite 라 해당 없음.)
#   주의: upload-artifact **v5 는 여전히 node20** 이라 경고가 안 사라진다 —
#   node24 가 기본인 v6 이상이 필요하다. v7 은 v6 + `archive`(옵트인)/ESM 뿐.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo:
    name: cargo (core + cli + server + gui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # BUG-017: gui crate 가 Tauri/wry transitive dep — Linux 에선 GTK/webkit
      # 시스템 라이브러리 필요. 없으면 gio-sys build-script 가 pkg-config 단계
      # 에서 실패. 목록은 Tauri v2 공식 문서.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential

      # BUG-017 fix1: gui crate compile 이 frontendDist (gui/frontend/build)
      # 를 요구 — tauri::generate_context! proc macro 가 그 path 의 존재를
      # build time 에 검증. cargo test 전에 frontend 를 먼저 build.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Frontend build (gui crate 가 의존)
        working-directory: gui/frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ~/.cargo/registry 만 캐시 — target/ 은 PR 마다 깨끗하게.
      # (CLAUDE.md 의 정책과 일치.)
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # NOTE: cargo fmt --check 는 의도적으로 빠짐 — 기존 코드베이스 일괄 정렬은
      # 별도 quest (대규모 diff). 추후 추가 예정.

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # BUG-052: BUG-048 의 static Mutex 가 recents env race 를 격리 →
        # multi-thread 안전. `--test-threads=1` 강제 제거 (CI 시간 단축).
        run: cargo test --workspace

  # DEV-313: macOS 컴파일 검증. 플랫폼 분기(`titlebar_win`/`titlebar_linux` 와
  # non-Windows 스텁, `lock.rs` 의 windows/not-windows)가 macOS 에서 깨지면
  # 릴리스 태그를 밀 때가 아니라 여기서 잡혀야 한다.
  #
  # clippy 는 리눅스 잡이 워크스페이스 전체를 이미 본다 — 여기선 macOS 에서만
  # 달라지는 것(컴파일 성립 + 런타임 동작)에 집중해 test 까지만 돌린다.
  macos:
    name: cargo (macos-arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      # gui crate 의 `tauri::generate_context!` 가 frontendDist 존재를 빌드
      # 시점에 검증 — 리눅스 잡과 같은 이유로 프론트를 먼저 만든다.
      - name: Frontend build (gui crate 가 의존)
        working-directory: gui/frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  gui-frontend:
    name: gui/frontend (svelte-kit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: svelte-kit sync
        run: npx svelte-kit sync

      - name: svelte-check
        run: npm run check

      # DEV-131: 컴포넌트 CSS hex 직접 사용 차단 (테마 토큰만). 재발 방지.
      - name: check no hex in component CSS
        run: npm run check:no-hex

      # BUG-169: 마크업 안 컬러 이모지 아이콘 차단 (Icon.svelte / 인라인 SVG).
      - name: check no emoji icons in markup
        run: npm run check:no-emoji

      # DEV-364: pill 모양은 global.css 의 `.pill` 하나가 정본 — 컴포넌트가
      # 다시 정의하면 실패. 정본이 없어 같은 quest_id 칩이 화면마다 갈렸다.
      - name: check pill single source
        run: npm run check:pill

      # DEV-369: 곡률·테두리를 리터럴 px 로 적으면 실패 (토큰만).
      # px 는 UI 배율을 안 따라간다 — BUG-244/254 가 같은 함정을 반복해 맞았다.
      - name: check no raw radius/border literals
        run: npm run check:radius

      # BUG-256: 여백·치수를 리터럴 px 로 적으면 실패 (rem 만).
      # font-size 는 rem 인데 padding/gap 만 px 이면 배율에서 비율이 어긋난다.
      # px 가 맞는 구간은 소스에 `check-spacing:off/on` 으로 표시한다.
      - name: check no raw spacing/size literals
        run: npm run check:spacing

      # DEV-272: 글꼴 스택을 컴포넌트에 직접 적으면 실패 (토큰만).
      # 직접 적은 곳은 글꼴 설정을 안 따라간다 — 실제로 46곳이 그랬다.
      - name: check no raw font stacks
        run: npm run check:font

      # BUG-264: 높이의 `vh` 는 모바일에서 주소창이 접힌 높이라 실제 화면보다
      # 크다 — 그만큼 아래가 잘린다. `dvh` 폴백 쌍을 강제한다.
      - name: check viewport height units
        run: npm run check:viewport

      - name: vitest
        run: npm test -- --run

      - name: vite build
        run: npm run build

  # BUG-171: 릴리스 노트 추출 스모크 테스트.
  # 릴리스 본문은 태그 push 때만 만들어지므로, 스크립트가 깨져도 다음 릴리스
  # 까지 모른다(실제로 그래서 0.4.1 이 중복 본문으로 나갔다). CHANGELOG 의
  # 최신 출시 버전으로 매 push 마다 추출을 돌려 회귀를 잡는다 — 빌드가 없어
  # 몇 초면 끝난다. 러너의 pwsh 7 + BOM 없는 UTF-8 경로도 여기서 검증된다.
  release-notes:
    name: release notes extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract notes for latest released version
        shell: pwsh
        run: |
          $m = Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+\S*)' |
            Select-Object -First 1
          if (-not $m) { throw "CHANGELOG 에 출시 버전 헤딩(## X.Y.Z)이 없음" }
          $version = $m.Matches[0].Groups[1].Value
          Write-Host "최신 출시 버전: $version"
          ./scripts/extract-release-notes.ps1 `
            -Tag "v$version" -Repo "${{ github.repository }}" -OutFile release-notes.md
          $body = Get-Content release-notes.md -Raw
          if ($body -notmatch 'Full Changelog') { throw "compare 링크 누락" }
          # 한글이 깨졌는지 — U+FFFD(치환 문자)가 있으면 인코딩 사고.
          if ($body -match [char]0xFFFD) { throw "인코딩 손상(U+FFFD 발견)" }
          Write-Host "--- 릴리스 본문 미리보기 (앞 40줄) ---"
          Get-Content release-notes.md -TotalCount 40

      - name: Upload notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-preview
          path: release-notes.md
          retention-days: 7
