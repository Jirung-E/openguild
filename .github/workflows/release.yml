name: release

# DEV-071: tag v* push → Windows NSIS installer 자동 빌드 + GitHub Release 첨부.
# BUG-149: linux job 추가 — deb/rpm/AppImage 도 같은 태그 릴리즈에 첨부.
#
# 동작 모드:
#   - tag push (`v*`): 전체 파이프라인. 각 job 이 자기 플랫폼 패키지를 빌드해
#     같은 GitHub Release 에 첨부.
#   - workflow_dispatch (수동): 빌드만 수행, Release 생성 안 함. Artifact 로
#     패키지 업로드 (dry-run 검증용).
#
# 후속 작업 (이 quest 범위 외):
#   - 코드 사이닝 (Windows EV 인증서) — Windows SmartScreen "알 수 없는 게시자" 경고 제거.
#   - multi-arch (aarch64-pc-windows-msvc / aarch64 Linux) — matrix 확장.
#   - macOS runner — matrix 확장.
#   - auto-updater (DEV-063) — Linux 첨부물에도 latest.json 추가(현재 Windows 전용).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# softprops/action-gh-release 가 Release 생성/업로드하려면 contents: write 필요.
permissions:
  contents: write

jobs:
  windows:
    name: build & release (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache 가 target/ + ~/.cargo/registry + ~/.cargo/git +
      # ~/.cargo/bin (cache-bin) 모두 캐시. tauri-cli (~5분 install) 도 캐싱
      # 대상이라 두 번째 run 부터 빨라짐.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-bin: true

      - name: npm ci (frontend)
        working-directory: gui/frontend
        run: npm ci

      # DEV-034: NSIS custom template 이 target/release/openguild.exe 와
      # openguild-server.exe 를 상대경로 (..\..\openguild{,-server}.exe) 로
      # 참조. cargo tauri build 보다 먼저 두 binary 가 그 위치에 있어야 함.
      - name: Build CLI + Server (release)
        run: cargo build --release -p openguild-cli -p openguild-server

      - name: Install tauri-cli
        # cache-bin: true 가 적중하면 skip. 첫 run / 캐시 키 변경 시만 install.
        run: cargo install tauri-cli --version '^2' --locked

      - name: Tauri build (NSIS)
        working-directory: gui
        # beforeBuildCommand 가 npm run build 호출 (frontend dist 생성).
        # DEV-063: createUpdaterArtifacts:true + signing key env 가 있으면
        # *-setup.exe 와 함께 *-setup.exe.sig (서명) 도 생성.
        # secret 미설정 시 (포크 / 초기) signing 은 skip — 일반 installer 만.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # Artifact 는 항상 업로드 (workflow_dispatch dry-run 도 검증 가능).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: openguild-windows-x64-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

      # DEV-063: updater 가 fetch 하는 latest.json 생성.
      # setup.exe.sig 의 내용 (서명) + release asset download URL 을 조합.
      # tag push 일 때만 (URL 에 tag 필요). signing secret 없으면 .sig 가
      # 없어 skip — 그 경우 updater 비활성 release (일반 installer 만).
      - name: Generate latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $nsisDir = "target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "setup.exe 없음" }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) {
            Write-Host "::warning::*.sig 없음 — signing secret 미설정. latest.json skip (updater 비활성)."
            exit 0
          }
          $sig = Get-Content $sigFile -Raw
          $repo = "${{ github.repository }}"
          $url = "https://github.com/$repo/releases/download/$tag/$($exe.Name)"
          $json = [ordered]@{
            version   = $version
            notes     = "See the release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig.Trim()
                url       = $url
              }
            }
          }
          $out = "$nsisDir/latest.json"
          $json | ConvertTo-Json -Depth 5 | Set-Content $out -Encoding utf8
          Write-Host "latest.json 생성:"
          Get-Content $out

      # BUG-171: 릴리스 노트를 CHANGELOG.md 에서 뽑아 본문으로 명시한다.
      # generate_release_notes 를 쓰면 windows/linux 두 잡이 같은 릴리스를
      # 각각 갱신하면서 "기존 본문 + 새로 생성한 노트" 가 되어 두 번 표시됐다
      # (액션 규칙: body 가 있으면 자동 생성 노트 앞에 붙는다). 본문을 명시하면
      # 나중 잡이 같은 내용으로 덮어써서 잡 순서와 무관하게 항상 하나다.
      # 덤으로, 자동 생성 노트는 PR 목록 기반이라 PR 없이 직접 커밋하는 이
      # 저장소에서는 compare 링크 한 줄뿐이었다 — CHANGELOG 가 릴리스 페이지에
      # 전혀 표시되지 않던 것도 같이 해결된다.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >
          ./scripts/extract-release-notes.ps1
          -Tag "${{ github.ref_name }}"
          -Repo "${{ github.repository }}"
          -OutFile release-notes.md

      # tag push 일 때만 GitHub Release 생성 + 첨부.
      # workflow_dispatch (dry-run) 는 위의 artifact 까지만.
      # DEV-063: latest.json + *.sig 도 첨부 (updater endpoint 가 fetch).
      # fail_on_unmatched_files:false — signing secret 없는 환경에서 .sig /
      # latest.json 이 없어도 release 는 성공 (일반 installer 만 첨부).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          body_path: release-notes.md
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  linux:
    name: build & release (linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-bin: true

      # Tauri v2 공식 Linux 빌드 사전 요구사항 (Debian/Ubuntu).
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm ci (frontend)
        working-directory: gui/frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      # `gui/tauri.conf.json` 의 bundle.targets 에 deb/rpm/appimage 가 이미
      # 있음(BUG-142). 여긴 Linux 러너에서 그 세 타깃만 명시적으로 빌드.
      # NSIS 와 달리 CLI/서버 바이너리를 별도로 bundle 에 끼워넣지 않음 —
      # deb/rpm/appimage 는 GUI 앱만 패키징(기존 범위와 동일).
      - name: Tauri build (deb/rpm/AppImage)
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles deb,rpm,appimage

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openguild-linux-x64-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      # BUG-171: windows 잡과 동일 — CHANGELOG 절을 본문으로 명시(같은 내용으로
      # 덮어쓰므로 두 잡의 실행 순서와 무관하게 본문은 항상 하나).
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >
          ./scripts/extract-release-notes.ps1
          -Tag "${{ github.ref_name }}"
          -Repo "${{ github.repository }}"
          -OutFile release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          body_path: release-notes.md
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
