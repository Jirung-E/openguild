name: release

# DEV-071: tag v* push → Windows NSIS installer 자동 빌드 + GitHub Release 첨부.
# BUG-149: linux job 추가 — deb/rpm/AppImage 도 같은 태그 릴리즈에 첨부.
#
# 동작 모드:
#   - tag push (`v*`): 전체 파이프라인. 각 job 이 자기 플랫폼 패키지를 빌드해
#     같은 GitHub Release 에 첨부.
#   - workflow_dispatch (수동): 빌드만 수행, Release 생성 안 함. Artifact 로
#     패키지 업로드 (dry-run 검증용).
#
# 후속 작업 (이 quest 범위 외):
#   - 코드 사이닝 (Windows EV 인증서) — Windows SmartScreen "알 수 없는 게시자" 경고 제거.
#   - multi-arch (aarch64-pc-windows-msvc / aarch64 Linux) — matrix 확장.
#   - auto-updater (DEV-063) — Linux 첨부물에도 latest.json 추가.
#
# BUG-172: Node 20 deprecation 경고 대응 — node20 런타임 액션만 상향.
#   upload-artifact v4 → v7, action-gh-release v2 → v3.
#   (checkout/setup-node/cache v5, Swatinem/rust-cache v2 는 이미 node24,
#    dtolnay/rust-toolchain 은 composite 라 해당 없음.)
#   주의: upload-artifact **v5 는 여전히 node20** 이라 경고가 안 사라진다 —
#   node24 가 기본인 v6 이상이 필요하다. v7 은 v6 + `archive`(옵트인)/ESM 뿐.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# softprops/action-gh-release 가 Release 생성/업로드하려면 contents: write 필요.
permissions:
  contents: write

jobs:
  windows:
    name: build & release (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache 가 target/ + ~/.cargo/registry + ~/.cargo/git +
      # ~/.cargo/bin (cache-bin) 모두 캐시. tauri-cli (~5분 install) 도 캐싱
      # 대상이라 두 번째 run 부터 빨라짐.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-bin: true

      - name: npm ci (frontend)
        working-directory: gui/frontend
        run: npm ci

      # DEV-034: NSIS custom template 이 target/release/openguild.exe 와
      # openguild-server.exe 를 상대경로 (..\..\openguild{,-server}.exe) 로
      # 참조. cargo tauri build 보다 먼저 두 binary 가 그 위치에 있어야 함.
      - name: Build CLI + Server (release)
        run: cargo build --release -p openguild-cli -p openguild-server

      - name: Install tauri-cli
        # cache-bin: true 가 적중하면 skip. 첫 run / 캐시 키 변경 시만 install.
        run: cargo install tauri-cli --version '^2' --locked

      - name: Tauri build (NSIS)
        working-directory: gui
        # beforeBuildCommand 가 npm run build 호출 (frontend dist 생성).
        # DEV-063: createUpdaterArtifacts:true + signing key env 가 있으면
        # *-setup.exe 와 함께 *-setup.exe.sig (서명) 도 생성.
        # secret 미설정 시 (포크 / 초기) signing 은 skip — 일반 installer 만.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # Artifact 는 항상 업로드 (workflow_dispatch dry-run 도 검증 가능).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: openguild-windows-x64-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

      # DEV-063/DEV-314: updater 의 latest.json 은 이 잡이 만들지 않는다.
      # 플랫폼이 늘면 잡마다 같은 파일 이름을 덮어써 한 플랫폼만 남는다 —
      # 릴리스에 올라간 `*.sig` 자산을 보고 updater-manifest 잡이 합친다.
      # 여기서 할 일은 installer 와 그 `.sig` 를 릴리스에 올리는 것뿐.

      # BUG-171: 릴리스 노트를 CHANGELOG.md 에서 뽑아 본문으로 명시한다.
      # generate_release_notes 를 쓰면 windows/linux 두 잡이 같은 릴리스를
      # 각각 갱신하면서 "기존 본문 + 새로 생성한 노트" 가 되어 두 번 표시됐다
      # (액션 규칙: body 가 있으면 자동 생성 노트 앞에 붙는다). 본문을 명시하면
      # 나중 잡이 같은 내용으로 덮어써서 잡 순서와 무관하게 항상 하나다.
      # 덤으로, 자동 생성 노트는 PR 목록 기반이라 PR 없이 직접 커밋하는 이
      # 저장소에서는 compare 링크 한 줄뿐이었다 — CHANGELOG 가 릴리스 페이지에
      # 전혀 표시되지 않던 것도 같이 해결된다.
      # workflow_dispatch(dry-run)에서도 돌린다 — 태그를 밀지 않고 실제 러너에서
      # 본문을 만들어 artifact 로 확인할 수 있다. dispatch 시 ref_name 은 브랜치
      # 이름이라 CHANGELOG 의 최신 출시 버전을 태그로 대신 쓴다.
      - name: Extract release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ("${{ github.ref }}").StartsWith('refs/tags/')) {
            $m = Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+\S*)' |
              Select-Object -First 1
            if (-not $m) { throw "CHANGELOG 에 출시 버전 헤딩(## X.Y.Z)이 없음" }
            $tag = "v$($m.Matches[0].Groups[1].Value)"
            Write-Host "dry-run — CHANGELOG 최신 출시 버전으로 대체: $tag"
          }
          ./scripts/extract-release-notes.ps1 `
            -Tag $tag -Repo "${{ github.repository }}" -OutFile release-notes.md

      - name: Upload release notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ runner.os }}
          path: release-notes.md
          retention-days: 7

      # tag push 일 때만 GitHub Release 생성 + 첨부.
      # workflow_dispatch (dry-run) 는 위의 artifact 까지만.
      # DEV-063: latest.json + *.sig 도 첨부 (updater endpoint 가 fetch).
      # fail_on_unmatched_files:false — signing secret 없는 환경에서 .sig /
      # latest.json 이 없어도 release 는 성공 (일반 installer 만 첨부).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          body_path: release-notes.md
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  # DEV-313: macOS(Apple Silicon) — macos-26 러너가 arm64 네이티브다.
  # macos-14 는 2026-11-02 지원 종료 예정이라 0.5.0 릴리스 전에 전환했다.
  # Intel 맥은 대상 외(admin 결정) — universal 로 만들면 용량이 두 배가 된다.
  #
  # 미서명 배포다(Apple Developer 계정 없음). 첫 실행 시 Gatekeeper 경고가
  # 뜨므로 README 에 우회 절차를 적어뒀다. 인증서가 생기면 여기에
  # APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / APPLE_ID 계열 env 만 추가하면
  # 되고, 나머지 파이프라인은 그대로다.
  macos:
    name: build & release (macos-arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-bin: true

      - name: npm ci (frontend)
        working-directory: gui/frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      # DEV-349: DMG 는 GUI 만 담는다. CLI/Server 는 사용자가 Rust/Cargo 없이
      # 설치할 수 있도록 별도 tar.gz 로 묶어 같은 artifact/Release 에 첨부한다.
      - name: Build CLI / Server
        run: cargo build --release -p openguild-cli -p openguild-server

      - name: Package CLI / Server tar.gz
        run: bash scripts/package-macos-cli-server.sh

      # `gui/tauri.macos.conf.json` 의 bundle.targets 가 app/dmg 이므로 로컬
      # `cargo tauri build` 와 동일한 산출물이 나온다(--bundles 는 명시일 뿐).
      # createUpdaterArtifacts:true → `.app.tar.gz` + `.sig` 도 함께 생성.
      - name: Tauri build (app/dmg)
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles app,dmg

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openguild-macos-arm64-packages
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/openguild_*_macos_arm64_cli-server.tar.gz
            target/release/openguild_*_macos_arm64_cli-server.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      # DEV-314: latest.json 은 updater-manifest 잡이 릴리스 자산에서 합친다.
      # 여기선 dmg + `.app.tar.gz(.sig)` + CLI/Server tar.gz 를 릴리스에
      # 올리기만 하면 된다.
      - name: Extract release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ("${{ github.ref }}").StartsWith('refs/tags/')) {
            $m = Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+\S*)' |
              Select-Object -First 1
            if (-not $m) { throw "CHANGELOG 에 출시 버전 헤딩(## X.Y.Z)이 없음" }
            $tag = "v$($m.Matches[0].Groups[1].Value)"
            Write-Host "dry-run — CHANGELOG 최신 출시 버전으로 대체: $tag"
          }
          ./scripts/extract-release-notes.ps1 `
            -Tag $tag -Repo "${{ github.repository }}" -OutFile release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/openguild_*_macos_arm64_cli-server.tar.gz
            target/release/openguild_*_macos_arm64_cli-server.tar.gz.sha256
          body_path: release-notes.md
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  linux:
    name: build & release (linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-bin: true

      # Tauri v2 공식 Linux 빌드 사전 요구사항 (Debian/Ubuntu).
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm ci (frontend)
        working-directory: gui/frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      # `gui/tauri.conf.json` 의 bundle.targets 에 deb/rpm/appimage 가 이미
      # 있음(BUG-142). 여긴 Linux 러너에서 그 세 타깃만 명시적으로 빌드.
      # NSIS 와 달리 CLI/서버 바이너리를 별도로 bundle 에 끼워넣지 않음 —
      # deb/rpm/appimage 는 GUI 앱만 패키징(기존 범위와 동일).
      - name: Tauri build (deb/rpm/AppImage)
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles deb,rpm,appimage

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openguild-linux-x64-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      # BUG-171: windows 잡과 동일 — CHANGELOG 절을 본문으로 명시(같은 내용으로
      # 덮어쓰므로 두 잡의 실행 순서와 무관하게 본문은 항상 하나).
      # workflow_dispatch(dry-run)에서도 돌린다 — 태그를 밀지 않고 실제 러너에서
      # 본문을 만들어 artifact 로 확인할 수 있다. dispatch 시 ref_name 은 브랜치
      # 이름이라 CHANGELOG 의 최신 출시 버전을 태그로 대신 쓴다.
      - name: Extract release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ("${{ github.ref }}").StartsWith('refs/tags/')) {
            $m = Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+\S*)' |
              Select-Object -First 1
            if (-not $m) { throw "CHANGELOG 에 출시 버전 헤딩(## X.Y.Z)이 없음" }
            $tag = "v$($m.Matches[0].Groups[1].Value)"
            Write-Host "dry-run — CHANGELOG 최신 출시 버전으로 대체: $tag"
          }
          ./scripts/extract-release-notes.ps1 `
            -Tag $tag -Repo "${{ github.repository }}" -OutFile release-notes.md

      - name: Upload release notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ runner.os }}
          path: release-notes.md
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          body_path: release-notes.md
          append_body: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  # DEV-314: 플랫폼별 조각을 하나의 latest.json 으로 합쳐 릴리스에 첨부.
  #
  # updater 엔드포인트는 `releases/latest/download/latest.json` 하나뿐이라
  # 파일도 하나여야 한다. 빌드 잡들이 각자 같은 이름으로 올리면 마지막 잡이
  # 이겨서 나머지 플랫폼이 통째로 사라진다 — 그래서 합치는 단계를 따로 둔다.
  #
  # 조각이 하나도 없으면(서명 시크릿 미설정) latest.json 없이 끝낸다 —
  # 그 릴리스는 자동 업데이트가 비활성일 뿐, 설치 파일은 정상이다.
  updater-manifest:
    name: updater manifest (latest.json)
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # 조각 파일을 잡 사이로 나르지 않는다 — 빌드 잡들이 이미 릴리스에 올린
      # `*.sig` 자산이 진리원이다. 실제로 배포된 파일에서 매니페스트를 만드므로
      # "artifact 는 있는데 릴리스엔 안 올라간" 어긋남이 원천적으로 없다.
      - name: Compose latest.json from release assets
        id: compose
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          repo="${{ github.repository }}"
          mkdir -p sigs
          gh release download "$tag" --repo "$repo" --pattern '*.sig' --dir sigs || true
          shopt -s nullglob
          files=(sigs/*.sig)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::서명(*.sig) 자산 없음 — latest.json 생략(자동 업데이트 비활성)."
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$version" "$repo" "$tag" "${files[@]}" <<'PY'
          import datetime, json, os, sys

          version, repo, tag = sys.argv[1:4]

          # 자산 이름 → updater 플랫폼 키. 새 플랫폼을 추가하면 여기 한 줄만 는다.
          def platform_of(asset: str):
              if asset.endswith('-setup.exe'):
                  return 'windows-x86_64'
              if asset.endswith('.app.tar.gz'):
                  return 'darwin-aarch64'
              return None  # deb/rpm/AppImage 는 updater 대상이 아니다.

          platforms = {}
          for path in sys.argv[4:]:
              asset = os.path.basename(path)[: -len('.sig')]
              key = platform_of(asset)
              if key is None:
                  print(f'skip (updater 대상 아님): {asset}')
                  continue
              platforms[key] = {
                  'signature': open(path, encoding='utf-8-sig').read().strip(),
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{asset}',
              }

          if not platforms:
              raise SystemExit('서명은 있는데 updater 플랫폼으로 해석된 게 없음')

          manifest = {
              'version': version,
              'notes': 'See the release page for details.',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime(
                  '%Y-%m-%dT%H:%M:%SZ'
              ),
              'platforms': dict(sorted(platforms.items())),
          }
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
          echo "has_manifest=true" >> "$GITHUB_OUTPUT"

      - name: Attach latest.json to release
        if: steps.compose.outputs.has_manifest == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: latest.json
          # 본문은 빌드 잡들이 이미 CHANGELOG 절로 채웠다 — 여기서 덮어쓰지 않는다.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
