[package]
name = "openguild-core"
version = "0.5.3-beta"
license = "MIT"
edition = "2024"
description = "openguild core — 비즈니스 로직, sqlx, 모델. server / cli / desktop 공유."

[dependencies]
# DB
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["full"] }

# OS 별 user config / data 경로 (recents.json 등)
directories = "5"

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# guild 파일 파싱
toml = "0.8"

# 에러 처리
anyhow = "1"
thiserror = "2"

# 로깅
tracing = "0.1"

# DEV-041: 타임스탬프 ISO 8601 + TZ offset 포맷.
# default-features=false 로 wasm/시간 외 기능 제거 — std + clock 만.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# DEV-094: 댓글 entry 마커 (`<!-- og-comment id="..." ts="..." -->`) 파싱.
regex = "1"

# DEV-376: 플러그인 판단·가공 스크립트. **I/O 를 안 주는 것이 이 선택의 이유다**
# — JS 를 넣으려면 3개 바이너리에 런타임을 얹어야 하고, AI 를 부르려면
# 스크립트에 네트워크를 줘야 해서 샌드박스가 무의미해진다.
#
# `no_module` 은 크기 절감이자 **샌드박스의 일부**다 — `import` 가 사라지면
# 파일을 읽을 경로 자체가 없어진다(기본 모듈 해석기는 디스크를 읽는다).
# `sync` 는 필수 — 컴파일된 AST 가 전달 스레드로 건너간다.
rhai = { version = "1", default-features = false, features = [
    "std",
    "sync",
    "no_module",
] }

# DEV-377: 플러그인 `post` 전달. **코어가 소유한다** — cli/gui/server 가 각자
# 구현하면 같은 코드가 셋으로 갈라지고, gui/server 는 어차피 클라이언트를
# 새로 들여야 한다. cli 와 같은 기능 조합으로 맞춰 TLS 스택이 겹치지 않게 했다.
# `blocking` 인 이유는 전달이 전용 스레드에서 돌기 때문이다(tokio 밖).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
] }
