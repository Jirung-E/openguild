[package]
name = "openguild-cli"
version = "0.1.0"
edition = "2024"
description = "OpenGuild CLI — agent-friendly HTTP client for the OpenGuild server"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
