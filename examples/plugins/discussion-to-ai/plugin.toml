#:schema ../plugin.schema.json
# 토론 댓글을 **이 컴퓨터에서 돌고 있는 것**에 건네준다 — 밖으로 나가는 것이 없다.
#
# BUG-311: 예전에는 웹훅으로 밖에 보냈다. 뜻은 그게 아니라 옆에서 돌고 있는 AI 세션에
# 말을 걸어 주는 것이다(admin). 그래서 `post` 를 걷고 `run` 으로 바꿨다 — 토큰도 필요 없다.

name        = "discussion-to-ai"
description = "토론 댓글을 이 컴퓨터에서 돌고 있는 AI 세션에 건네줍니다. 받은 편지함 파일 · 프로그램 · tmux 창 중에서 고릅니다. 밖으로 나가는 것은 없습니다."
scope       = ["cli", "gui", "server"]
scripts     = ["main.rhai"]

# 훅의 작업 폴더는 이 플러그인의 데이터 폴더다 — 받은 편지함도 기본으로 거기 쌓인다.
# BUG-331: AI 를 부르는 길에 8초는 뜻이 없다 — `claude -p` 는 아주 짧은 물음에도 5초쯤
# 걸린다. 잘리면 아무 흔적 없이 사라진다. 넉넉히 준다. `run` 은 이 기계에서 도는 것이라
# 길게 줘도 밖에 매달리지 않고, `wait` 을 안 켜므로 사람을 기다리게 하지도 않는다.
[actions.ai.run]
    command    = "sh"
    args       = ["${OPENGUILD_PLUGIN_DIR}/deliver.sh"]
    timeout_ms = 60000

    # Windows 에는 sh 가 없다.
    [actions.ai.run.windows]
        command = "powershell"
        args    = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "${OPENGUILD_PLUGIN_DIR}/deliver.ps1"]

# 한 번 해결한 토론이 다시 열리는 것(comment.unresolved)도 "답이 필요한 상태" 다.
#
# BUG-333: **`comment.discussion_on` 이 꼭 있어야 한다.** 앱은 댓글을 먼저 달고 그 다음에
# 토론으로 바꾼다 — 그 순간의 `comment.added` 는 `discussion` 이 거짓이라 아래 `wanted` 에
# 걸려 조용히 버려진다. 토글할 때 나오는 이 이벤트를 안 보면 앱에서 단 것은 영영 안 간다.
# CLI 의 `--discussion` 은 한 번에 만들어져 `comment.added` 로만 오므로 두 번 가지 않는다.
#
# BUG-331: 시한은 **두 군데**다 — 동작(위 `[actions.ai.run]`)과 이 줄. 줄에 안 적으면
# 기본 10초라, 동작만 늘려 놓으면 "14970ms 걸렸습니다(시한 10000ms)" 가 남는다. 둘 다
# 넉넉히 준다. 코어가 60초까지만 받아 주므로 그 위로는 더 못 늘린다 — 아주 긴 대화를
# 물리려면 명령 쪽에서 먼저 받아 두고 뒤에서 처리하는 편이 낫다.
[[handlers]]
    id         = "토론 전달"
    post       = ["comment.added", "comment.unresolved", "comment.discussion_on"]
    call       = "forward"
    timeout_ms = 60000

[[inputs]]
    key     = "WHAT"
    label   = "보낼 대상"
    type    = "select"
    default = "unresolved"
    help    = "AI 를 부르는 훅이면 범위가 곧 비용입니다."
    options = [
        { value = "unresolved", label = "미해결 토론만" },
        { value = "discussion", label = "토론 댓글 전부" },
        { value = "all",        label = "모든 댓글" },
    ]

# BUG-329: 이름만 보고도 무엇을 하는지 알아야 한다. '받은 편지함' 은 내가 지은 말이라
# 무슨 뜻인지 알 수가 없었다(admin).
[[inputs]]
    key     = "HOW"
    label   = "어떻게 건넬까"
    type    = "select"
    default = "inbox"
    help    = "셋 다 이 컴퓨터 안입니다. 밖으로 나가지 않습니다."
    options = [
        { value = "inbox",   label = "파일에 쌓기" },
        { value = "command", label = "명령 실행" },
        { value = "tmux",    label = "tmux 창에 넣기" },
    ]

[[inputs]]
    key   = "INBOX_PATH"
    label = "쌓을 파일"
    help  = "'파일에 쌓기' 일 때. 비우면 이 플러그인의 데이터 폴더에 inbox.md 로 쌓입니다 — 그 폴더 경로는 허용 화면의 '작업 폴더' 에 있습니다. 세션이 이 파일을 지켜보게 하면 됩니다."

[[inputs]]
    key   = "AI_COMMAND"
    label = "실행할 명령"
    help  = "'명령 실행' 일 때. 셸 한 줄로 적습니다 — 댓글 본문이 그 명령의 입(stdin)으로 들어갑니다. 예: claude -p"

[[inputs]]
    key   = "TMUX_TARGET"
    label = "tmux 창"
    help  = "'tmux 창에 넣기' 일 때. tmux 의 대상 이름 — 예: ai:0.0 또는 세션 이름."

# BUG-329: **갔는지 알 수 있어야 한다.** 어느 길로 보내든 한 줄을 남긴다(작업 폴더의
# delivered.log). 명령이나 tmux 로 보내면 결과가 눈에 안 보이는데, 이 파일만 보면 언제
# 무엇이 어디로 갔는지 알 수 있다.
