#:schema ../plugin.schema.json
# 댓글에 `/session` 을 달면 댓글 대신 **터미널에서 그 퀘스트의 claude 세션을 연다** — 댓글 명령의 예(DEV-464).
#
# 세션 이름은 퀘스트 번호(`DEV-001`)다. 그 이름의 세션이 이 폴더에 있으면 이어서 열고(`claude -r`), 없으면 그
# 이름으로 새로 만든다(`claude -n`). 같은 이름이 여럿이면 `claude -r 이름` 이 그 이름으로 거른 고르기 목록을 띄운다.
#
# 바뀌기 전(pre) 줄이라 댓글이 저장되기 **전에** 본다 — 명령이면 막거나(기본) 기록 한 줄로 바꿔 남긴다.

name        = "claude-session"
description = "댓글에 /session 을 달면 이 컴퓨터의 터미널에서 퀘스트 번호 이름의 claude 세션을 열거나 새로 만듭니다. 밖으로 나가는 것은 없습니다."
# 터미널은 **이 컴퓨터**에 열린다 — 서버에서 돌면 서버 기계에 창이 뜬다. 그래서 앱과 CLI 만.
scope       = ["gui", "cli"]
scripts     = ["main.rhai"]

[actions.open.run]
    command    = "sh"
    args       = ["${OPENGUILD_PLUGIN_DIR}/open.sh"]
    timeout_ms = 10000

    # Windows 에는 sh 가 없다.
    [actions.open.run.windows]
        command = "powershell"
        args    = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "${OPENGUILD_PLUGIN_DIR}/open.ps1"]

[[handlers]]
    id   = "세션 열기"
    pre  = ["comment.added"]
    call = "on_comment"

[[inputs]]
    key     = "COMMAND"
    label   = "명령"
    type    = "text"
    default = "/session"
    help    = "댓글 본문이 정확히 이 글이면 명령으로 읽습니다(앞뒤 공백은 무시)."

[[inputs]]
    key     = "REPLY"
    label   = "명령 댓글은"
    type    = "select"
    default = "instead"
    help    = "대신 처리하면 댓글은 남지 않고 '플러그인이 대신 처리했습니다' 안내만 뜹니다. 기록으로 남기면 한 줄이 댓글로 남습니다."
    options = [
        { value = "instead", label = "대신 처리 (댓글 안 남김)" },
        { value = "record", label = "기록 한 줄로 바꿔 남기기" },
    ]

[[inputs]]
    key     = "PROJECT_DIR"
    label   = "세션 폴더"
    type    = "text"
    help    = "claude 를 띄우는 폴더 — 세션은 폴더마다 따로 모입니다. 비우면 길드 폴더(.guild 파일이 있는 곳)."
