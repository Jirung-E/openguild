#:schema ../plugin.schema.json
# 퀘스트와 댓글 소식을 텔레그램으로 보낸다.
#
# 줄마다 "언제 → 어떤 함수" 다. 한 플러그인이 이벤트마다 다른 함수를 부르고, 함수는
# `send("telegram", 본문)` 으로 아래 [actions.telegram] 에 보낸다.

name        = "telegram-quest-status"
description = "퀘스트와 댓글 소식을 텔레그램으로 보냅니다. 무엇을 알릴지는 설정에서 켜고 끕니다."
scope       = ["cli", "gui"]
scripts     = ["main.rhai"]

# 어디로 보내는지는 여기에만 있다 — 스크립트는 이름만 안다.
[actions.telegram.post]
    url        = "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
    body_env   = { chat_id = "TELEGRAM_CHAT_ID" }   # 본문의 chat_id 를 설정값으로 채운다
    timeout_ms = 8000

[[handlers]]
    id   = "생성 알림"
    post = ["quest.created"]
    call = "on_created"

[[handlers]]
    id   = "상태 알림"
    post = ["quest.status_changed"]
    call = "on_status"

[[handlers]]
    id   = "댓글 알림"
    post = ["comment.added"]
    # 댓글 이벤트에는 퀘스트 태그가 없다 — 달린 문서를 함께 받아 태그로 거른다(DEV-405).
    with = ["subject"]
    call = "on_comment"

[[inputs]]
    key    = "TELEGRAM_BOT_TOKEN"
    label  = "봇 토큰"
    secret = true
    help   = "텔레그램에서 @BotFather 에게 /newbot 하면 받습니다."

[[inputs]]
    key   = "TELEGRAM_CHAT_ID"
    label = "받을 채팅 ID"
    help  = "봇에게 아무 말이나 보낸 뒤 api.telegram.org/bot<토큰>/getUpdates 에서 chat.id 를 봅니다."

[[inputs]]
    key     = "ONLY_TAGGED"
    label   = "notify 태그가 붙은 퀘스트만"
    type    = "checkbox"
    default = true
    help    = "알림 받을 퀘스트를 평범한 태그로 고릅니다 — 퀘스트 화면의 태그 줄에서 notify 를 추가하거나 `openguild quest tag add DEV-001 notify`. 끄면 모든 퀘스트를 알립니다. 댓글에도 적용됩니다(댓글이 달린 문서를 보고 거릅니다)."

[[inputs]]
    key     = "ON_CREATED"
    label   = "퀘스트 생성 알림"
    type    = "checkbox"
    default = false

[[inputs]]
    key     = "ON_STATUS"
    label   = "퀘스트 상태 변경 알림"
    type    = "checkbox"
    default = true

[[inputs]]
    key     = "ON_COMMENT"
    label   = "댓글 알림"
    type    = "checkbox"
    default = false
