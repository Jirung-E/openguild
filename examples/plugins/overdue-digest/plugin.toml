#:schema ../plugin.schema.json
# 하루에 한 번, 기한이 지난 열린 퀘스트를 모아 알림 하나로 — 시간마다 도는 줄(`every`)의 예(DEV-458).
#
# 이벤트가 아니라 시간이 부른다. `query` 에 맞는 목록이 `e.items` 로 오고, 맞는 것이 없으면 함수를 부르지 않는다.
# 앱(gui) · 서버에서만 돈다(CLI 는 명령이 끝나면 꺼진다). 같은 기계에서 앱과 서버를 함께 열어도 한 번이다.

name        = "overdue-digest"
description = "하루에 한 번, 기한이 지난 열린 퀘스트를 모아 알림 하나로 알려 줍니다. 밖으로 나가는 것은 없습니다."
scope       = ["gui", "server"]
scripts     = ["main.rhai"]
permissions = ["notify"]

[[handlers]]
    id    = "기한 지남"
    every = "1d"
    query = "status:[open, in_progress] due:overdue"
    call  = "digest"

[[inputs]]
    key     = "MAX"
    label   = "알림에 적을 개수"
    type    = "number"
    default = 5
    help    = "이보다 많으면 '외 N건' 으로 줄입니다."
