#:schema ../plugin.schema.json
# 퀘스트가 생기거나 댓글이 달리면 데스크톱 알림 — 스크립트 없이 동작만 쓰는 예.
#
# 줄에 `action` 을 적으면 이벤트 JSON 이 그대로 그 동작으로 간다. 거르는 일은 셸에서 해도
# 된다 — 스크립트가 유일한 방법은 아니다.

name        = "desktop-notify"
description = "퀘스트가 생기거나 댓글이 달리면 이 컴퓨터에 데스크톱 알림을 띄웁니다. 밖으로 나가는 것은 없습니다."
# CLI 로 스무 개를 일괄 처리하는데 알림이 스무 번 뜨면 곤란하다 — 앱에서만.
scope       = ["gui"]

[actions.notify.run]
    command    = "sh"
    args       = ["${OPENGUILD_PLUGIN_DIR}/notify.sh"]
    timeout_ms = 10000

    # Windows 에는 sh 가 없다 — 그 OS 에서는 이것을 띄운다(BUG-294).
    [actions.notify.run.windows]
        command = "powershell"
        args    = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "${OPENGUILD_PLUGIN_DIR}/notify.ps1"]

[[handlers]]
    id     = "알림"
    post   = ["quest.created", "comment.added"]
    action = "notify"
