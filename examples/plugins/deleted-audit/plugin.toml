#:schema ../plugin.schema.json
# 퀘스트가 지워지기 **직전에** 무엇이 지워질지 남기고, `keep` 태그가 붙은 것은 막는다 —
# 바뀌기 전(pre) 단계의 예. 줄 둘이 한 이벤트를 순서대로 본다.

name        = "deleted-audit"
description = "퀘스트가 지워지기 직전에 그 내용을 deleted.log 에 남기고, `keep` 태그가 붙은 퀘스트는 삭제를 막습니다. 로그는 이 플러그인의 데이터 폴더에 쌓입니다."
scope       = ["cli", "gui", "server"]
scripts     = ["main.rhai"]

# 훅의 작업 폴더는 이 플러그인의 데이터 폴더다 — 여기에 쓰면 코드 폴더가 안 바뀐다.
[actions.log.run]
    command    = "sh"
    args       = ["-c", "cat >> deleted.log; echo >> deleted.log"]
    timeout_ms = 3000

# 줄은 적힌 순서대로 돈다 — 먼저 남기고, 그다음에 막을지 본다. 막힌 뒤의 줄은 안 돈다.
[[handlers]]
    id   = "삭제 기록"
    pre  = ["quest.deleted"]
    call = "record"

# 조건이 줄에 있으므로 함수는 "막는다" 만 한다.
[[handlers]]
    id   = "지킴"
    pre  = ["quest.deleted"]
    call = "keep"
    [handlers.when]
        "quest.tags" = "keep"

