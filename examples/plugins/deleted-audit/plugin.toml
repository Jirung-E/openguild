#:schema ../plugin.schema.json
# 퀘스트가 지워지기 **직전에** 무엇이 지워질지 남긴다 — 바뀌기 전(pre) 단계의 예.

name        = "deleted-audit"
description = "퀘스트가 지워지기 직전에 그 내용을 deleted.log 에 남깁니다. 지워진 뒤에는 볼 수 없는 것을 미리 기록해 둡니다. 로그는 이 플러그인의 데이터 폴더에 쌓입니다."
scope       = ["cli", "gui", "server"]
scripts     = ["main.rhai"]

# 훅의 작업 폴더는 이 플러그인의 데이터 폴더다 — 여기에 쓰면 코드 폴더가 안 바뀐다.
[actions.log.run]
    command    = "sh"
    args       = ["-c", "cat >> deleted.log; echo >> deleted.log"]
    timeout_ms = 3000

[[handlers]]
    id   = "삭제 기록"
    pre  = ["quest.deleted"]
    call = "record"
