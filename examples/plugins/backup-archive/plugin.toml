# 백업이 만들어지면 정해 둔 폴더로 한 벌 복사한다.

name        = "backup-archive"
description = "백업이 만들어지면 정해 둔 폴더로 한 벌 복사해 둡니다. 길드 안의 백업은 7개만 남고 오래된 것이 지워지지만, 복사본은 지워지지 않습니다."
scope       = ["cli", "gui", "server"]
scripts     = ["main.rhai"]

[actions.archive.run]
    command    = "sh"
    args       = ["${OPENGUILD_PLUGIN_DIR}/archive.sh"]
    timeout_ms = 30000

    # Windows 에는 sh 가 없다 — 그 OS 에서는 이것을 띄운다(BUG-294).
    [actions.archive.run.windows]
        command = "powershell"
        args    = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "${OPENGUILD_PLUGIN_DIR}/archive.ps1"]

[[handlers]]
    id   = "복사"
    post = ["backup.created"]
    call = "copy_backup"

[[inputs]]
    key   = "ARCHIVE_DIR"
    label = "쌓아 둘 폴더"
    help  = 'Windows 는 D:\backup\openguild 처럼 적습니다. 길드 밖의 경로를 권합니다 — 길드 폴더를 통째로 잃어도 남습니다. 예: /Volumes/backup/openguild'

[[inputs]]
    key     = "ONLY_MANUAL"
    label   = "직접 만든 백업만"
    type    = "checkbox"
    default = false
    help    = "끄면 자동 백업(ops 50개 또는 24시간마다)까지 전부 복사합니다."
