[package]
name = "openguild-server"
version = "0.5.0-beta"
license = "MIT"
edition = "2024"
description = "openguild HTTP API 서버"

# 폴더는 `server/` 이지만 crate / binary 이름은 `openguild-server`.
# `cargo run --bin openguild-server` 로 실행.

[dependencies]
openguild-core = { path = "../core" }

# CLI 파싱
clap = { version = "4", features = ["derive"] }

# 웹 프레임워크
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "fs",
    "set-header",
    # DEV-332: 응답 gzip 압축. 우리 응답은 대부분 한글 JSON/마크다운이라
    # 압축률이 특히 좋다(원격 접속 체감).
    "compression-gzip",
] }

# DEV-337: 스트리밍 업로드 — body 를 청크 단위로 받아 파일로 흘려쓴다.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# DB
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DEV-229: openguild-server.toml 설정 파일 파싱.
toml = "0.8"

# DEV-152: 첨부 업로드 — Tauri invoke 와 동일 시그니처(base64 JSON body) 유지.
base64 = "0.22"

# 에러 처리
anyhow = "1"

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# 테스트의 시간 연산 — 자정 경계 wrap 버그 방지 (chrono 절대 시각 연산).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
# DEV-169: Windows exe 아이콘 임베드 (cfg(windows) 에서만 동작 — 다른 OS 는 no-op).
winresource = "0.1"
