[package]
name = "openguild-server"
version = "0.2.1-beta"
license = "MIT"
edition = "2024"
description = "openguild HTTP API 서버"

# 폴더는 `server/` 이지만 crate / binary 이름은 `openguild-server`.
# `cargo run --bin openguild-server` 로 실행.

[dependencies]
openguild-core = { path = "../core" }

# CLI 파싱
clap = { version = "4", features = ["derive"] }

# 웹 프레임워크
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# DB
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 에러 처리
anyhow = "1"

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# 테스트의 시간 연산 — 자정 경계 wrap 버그 방지 (chrono 절대 시각 연산).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
# DEV-169: Windows exe 아이콘 임베드 (cfg(windows) 에서만 동작 — 다른 OS 는 no-op).
winresource = "0.1"
