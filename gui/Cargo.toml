[package]
name = "openguild-gui"
version = "0.5.0-beta"
license = "MIT"
edition = "2024"
description = "openguild desktop 앱 — Tauri v2 shell + Svelte frontend (gui/frontend)."

[lib]
name = "openguild_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openguild-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# DEV-087: protocol-asset — 배너 / 본문 로컬 이미지를 asset:// 로 서빙.
tauri = { version = "2", features = ["protocol-asset"] }
# DEV-053: native file dialog (디렉토리 선택) — Welcome 에서 "폴더 열기".
tauri-plugin-dialog = "2"
# DEV-063: auto-update. updater = 체크 / 다운로드 / 설치, process = 재시작 (relaunch).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# BUG-040: 외부 링크 (`https://...`) 를 시스템 브라우저로 — `tauri-plugin-opener`.
# webview 안에서 navigate 되면 SPA 가 사라지는 문제 차단.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# DEV-069: 본문 첨부 — 프론트가 클립보드/드랍 파일을 base64 로 invoke.
base64 = "0.22"
serde_json = "1"
anyhow = "1"

# core 비즈니스 로직 — Tauri invoke 핸들러가 직접 호출 (DEV-004 에서 사용 확대)
openguild-core = { path = "../core" }

# DEV-052 후속: init_and_open_guild 의 .guild marker 파일 created_at 작성용.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# BUG-041 후속: Windows release 는 `windows_subsystem = "windows"` 로 빌드되어
# `--version` / `--help` 같은 console 출력이 부모 콘솔에서 안 보임 (cmd 가
# detach). `AttachConsole(ATTACH_PARENT_PROCESS)` + `SetStdHandle(CONOUT$)` 로
# 부모 콘솔에 attach 후 stdout/stderr 를 그쪽에 redirect.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # CreateFileW 의 SECURITY_ATTRIBUTES 인자 타입 때문에 Win32_Security 도 필요.
    "Win32_Security",
    # DEV-265: WM_NCHITTEST 가로채기 — 커스텀 최대화 버튼 호버 시 진짜
    # OS Snap Layout 플라이아웃이 뜨도록.
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# DEV-265 (Linux): 커스텀 타이틀바 창 컨트롤을 실제 GTK 아이콘 테마에서
# 조회해서 그리기 위함. wry/tao 가 이미 GTK3 바인딩(gtk 0.18.x)을 전이
# 의존성으로 끌어오므로 같은 버전대를 명시해 충돌 없이 재사용.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# BUG-142: 독바 아이콘 매칭용 `_GTK_APPLICATION_ID` X11 프로퍼티를 직접 써야
# 해서(아래 titlebar_linux.rs 참조) gdk 의 X11 전용 확장(xid 조회)과 raw
# Xlib(XChangeProperty)이 필요. wry/tao 가 이미 전이 의존성으로 끌어오는
# 버전대(gdkx11 0.18.x, x11 2.x)를 그대로 재사용.
gdkx11 = "0.18"
gdk = "0.18"
x11 = { version = "2", features = ["xlib"] }

[features]
# Production: 미리 빌드된 frontend 자산 임베드
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
