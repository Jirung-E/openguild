[package]
name = "openguild-gui"
version = "0.1.0-beta"
edition = "2024"
description = "openguild desktop 앱 — Tauri v2 shell + Svelte frontend (gui/frontend)."

[lib]
name = "openguild_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openguild-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# DEV-053: native file dialog (디렉토리 선택) — Welcome 에서 "폴더 열기".
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# core 비즈니스 로직 — Tauri invoke 핸들러가 직접 호출 (DEV-004 에서 사용 확대)
openguild-core = { path = "../core" }

# DEV-052 후속: init_and_open_guild 의 .guild marker 파일 created_at 작성용.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
# Production: 미리 빌드된 frontend 자산 임베드
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
