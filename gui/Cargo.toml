[package]
name = "openguild-gui"
version = "0.1.0"
edition = "2024"
description = "OpenGuild desktop 앱 — Tauri v2 shell + Svelte frontend (gui/frontend)."

[lib]
name = "openguild_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openguild-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# core 비즈니스 로직 — Tauri invoke 핸들러가 직접 호출 (DEV-004 에서 사용 확대)
openguild-core = { path = "../core" }

[features]
# Production: 미리 빌드된 frontend 자산 임베드
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
